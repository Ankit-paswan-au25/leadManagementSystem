# Bitbucket Pipelines for Sales Management System
# Monorepo with backend and frontend

image: node:20

definitions:
  caches:
    backend-node: backend/node_modules
    frontend-node: frontend/node_modules

pipelines:
  default:
    - parallel:
        - step:
            name: Backend - Build and Test
            caches:
              - backend-node
            script:
              - cd backend
              - npm ci
              - npm test
        - step:
            name: Frontend - Build and Test
            caches:
              - frontend-node
            script:
              - cd frontend
              - npm ci
              - npm run build:check || npm run build
              - npm test
